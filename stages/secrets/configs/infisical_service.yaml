---
kind: "iac.rcmd.space/file.v2"
id: "secrets.services.infisical.unit"
file:
  - name: "/etc/systemd/system/infisical-agent.service"
    mode: "644"
    ownership: "root:root"
    source: "stages/secrets/files/etc/systemd/system/infisical-agent.service"
---
