infisical:
  address: "https://pass.tiredsysadmin.cc"   # or http://<node-ip>:30080
auth:
  type: "universal-auth"
  config:
    client-id: "/etc/infisical/client-id"
    client-secret: "/etc/infisical/client-secret"
templates:
  - source-path: /etc/infisical/templates/podsync_toml.tmpl
    destination-path: /etc/podsync/podsync.toml  # <-- the file your service reads
    config:
      polling-interval: 60s
      execute:
        command: "/bin/systemctl restart podsync.service"    # reload on change
  - source-path: /etc/infisical/templates/secrets.json.tmpl
    destination-path: /etc/secrets/secrets.json
    config:
      polling-interval: 60s
      execute:
        command: "/bin/chmod 400 /etc/secrets/secrets.json && /bin/chown root:secrets /etc/secrets/secrets.json"
