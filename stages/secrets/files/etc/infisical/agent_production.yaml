infisical:
  address: "https://pass.tiredsysadmin.cc"
auth:
  type: "universal-auth"
  config:
    client-id: "/etc/infisical/client-id"
    client-secret: "/etc/infisical/client-secret"
sinks:
  - type: "file"
    config:
      path: "/etc/infisical/access-token"
templates:
  - source-path: /etc/infisical/templates/gitea_app_ini.tmpl
    destination-path: /etc/gitea/app.ini
    config:
      polling-interval: 60s
      execute:
        command: "/etc/infisical/hooks/gitea.sh"
  - source-path: /etc/infisical/templates/secrets.json.tmpl
    destination-path: /etc/secrets/secrets.json
    config:
      polling-interval: 60s
      execute:
        command: "/bin/chmod 400 /etc/secrets/secrets.json && /bin/chown root:secrets /etc/secrets/secrets.json"
